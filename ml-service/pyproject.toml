[project]
name = "intellicare-ml"
version = "0.1.0"
description = "IntelliCare ML & optimization service: demand forecasting, no-show prediction, OR-Tools optimization, SOP RAG"
authors = [
    { name = "Tejas Lokhande", email = "tej2005lok@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.53.0",
    "xgboost>=3.2.0",
]

[tool.uv]
package = false
