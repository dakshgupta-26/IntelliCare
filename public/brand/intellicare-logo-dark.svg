<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none" width="100%" height="100%" aria-label="IntelliCare Logo">
  <defs>
    <!-- Master Mark Gradients -->
    <linearGradient id="logo-top-grad" x1="38" y1="45" x2="48" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#083E9E" />
      <stop offset="35%" stop-color="#0066FF" />
      <stop offset="70%" stop-color="#00B2FE" />
      <stop offset="100%" stop-color="#4DD8FF" />
    </linearGradient>

    <linearGradient id="logo-bottom-grad" x1="50" y1="35" x2="40" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#083E9E" />
      <stop offset="35%" stop-color="#005BEA" />
      <stop offset="75%" stop-color="#00C0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="logo-left-grad" x1="49" y1="40" x2="14" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#052B75" />
      <stop offset="40%" stop-color="#0055EE" />
      <stop offset="85%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="logo-right-grad" x1="39" y1="40" x2="74" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A3C9E" />
      <stop offset="45%" stop-color="#0077FF" />
      <stop offset="85%" stop-color="#00C4FF" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <linearGradient id="logo-center-twist" x1="26" y1="47" x2="61" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0044CC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00B2FE" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="care-cyan-grad" x1="240" y1="20" x2="330" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B2FE" />
      <stop offset="100%" stop-color="#19C7F3" />
    </linearGradient>
  </defs>

  <!-- Symbol Mark (Left Side, 80x80 bounding box scaled to 0.5) -->
  <g transform="translate(0, 0)">
    <!-- 1. Left Petal -->
    <path
      d="M41 44 C33 46, 23 51, 16 49 C13 48, 12 44, 15 41 C20 36, 31 34, 42 37 Z"
      fill="url(#logo-left-grad)"
      opacity="0.96"
    />

    <!-- 2. Bottom Petal -->
    <path
      d="M40 41 C38 48, 35 60, 38 68 C40 72, 45 73, 48 69 C52 63, 51 50, 47 40 Z"
      fill="url(#logo-bottom-grad)"
    />

    <!-- 3. Right Petal -->
    <path
      d="M46 36 C54 34, 65 29, 72 31 C75 32, 76 36, 73 39 C68 44, 57 46, 46 43 Z"
      fill="url(#logo-right-grad)"
      opacity="0.96"
    />

    <!-- 4. Top Petal -->
    <path
      d="M48 39 C50 32, 53 20, 50 12 C48 8, 43 7, 40 11 C36 17, 37 30, 41 40 Z"
      fill="url(#logo-top-grad)"
    />

    <!-- 5. Center Twist -->
    <path
      d="M33 42 C38 38, 45 33, 53 31 C56 30, 58 32, 55 35 C48 41, 41 47, 34 49 C31 50, 29 48, 31 44 Z"
      fill="url(#logo-center-twist)"
    />
  </g>

  <!-- Wordmark Text Lockup -->
  <g transform="translate(90, 0)">
    <!-- "Intelli" in Pure White -->
    <text
      x="0"
      y="48"
      fill="#FFFFFF"
      font-family="Outfit, Inter, system-ui, -apple-system, sans-serif"
      font-size="38"
      font-weight="700"
      letter-spacing="-0.5"
    >Intelli</text>

    <!-- "Care" in Brand Cyan/Blue -->
    <text
      x="108"
      y="48"
      fill="url(#care-cyan-grad)"
      font-family="Outfit, Inter, system-ui, -apple-system, sans-serif"
      font-size="38"
      font-weight="700"
      letter-spacing="-0.5"
    >Care</text>

    <!-- Subtitle: "INTELLIGENCE FOR A HEALTHIER TOMORROW" -->
    <text
      x="2"
      y="66"
      fill="#8899A6"
      font-family="JetBrains Mono, monospace"
      font-size="8"
      font-weight="600"
      letter-spacing="2.5"
    >INTELLIGENCE FOR A HEALTHIER TOMORROW</text>
  </g>
</svg>
